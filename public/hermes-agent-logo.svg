<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Hermes Agent Logo - 简化版黑白头像 -->
  <defs>
    <clipPath id="circleClip">
      <circle cx="16" cy="16" r="15"/>
    </clipPath>
  </defs>
  
  <!-- 白色圆形背景 -->
  <circle cx="16" cy="16" r="15" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="1"/>
  
  <!-- 动漫女孩头像（简化版） -->
  <g clip-path="url(#circleClip)">
    <!-- 头发（黑色长发） -->
    <path d="M6 11 Q4 16 5.5 22 Q6 27 9.5 29 L11 27 Q8 24 8 19 Q8 14 11 11 Q13.5 8 16 8 Q18.5 8 21 11 Q24 14 24 19 Q24 24 21 27 L22.5 29 Q26 27 26.5 22 Q28 16 26 11 Q24 5 16 5 Q8 5 6 11 Z" fill="#1a1a1a"/>
    
    <!-- 刘海 -->
    <path d="M7.5 13 Q9.5 9.5 12.5 10.5 Q14 11 16 9.5 Q18 11 19.5 10.5 Q22.5 9.5 24.5 13 Q23.5 16 21.5 14.5 Q20 13 19 14 Q17.5 15 16 13.5 Q14.5 15 13 14 Q12 13 10.5 14.5 Q8.5 16 7.5 13 Z" fill="#1a1a1a"/>
    
    <!-- 脸部轮廓 -->
    <ellipse cx="16" cy="17.5" rx="7" ry="8.5" fill="#FFFFFF"/>
    
    <!-- 眼睛（左眼） -->
    <ellipse cx="12.5" cy="16.5" rx="2" ry="2.5" fill="#1a1a1a"/>
    <ellipse cx="13" cy="15.5" rx="0.8" ry="1" fill="#FFFFFF"/>
    
    <!-- 眼睛（右眼） -->
    <ellipse cx="19.5" cy="16.5" rx="2" ry="2.5" fill="#1a1a1a"/>
    <ellipse cx="20" cy="15.5" rx="0.8" ry="1" fill="#FFFFFF"/>
    
    <!-- 眉毛 -->
    <path d="M10 14 Q12.5 12.5 15 14" stroke="#1a1a1a" stroke-width="0.8" fill="none"/>
    <path d="M17 14 Q19.5 12.5 22 14" stroke="#1a1a1a" stroke-width="0.8" fill="none"/>
    
    <!-- 鼻子 -->
    <circle cx="16" cy="19" r="0.5" fill="#1a1a1a"/>
    
    <!-- 嘴巴 -->
    <path d="M14 22.5 Q16 24 18 22.5" stroke="#1a1a1a" stroke-width="1" fill="none" stroke-linecap="round"/>
    
    <!-- 发箍 -->
    <path d="M9 9 Q16 6.5 23 9" stroke="#1a1a1a" stroke-width="2" fill="none"/>
    <rect x="14.5" y="5.5" width="3" height="2" rx="0.5" fill="#1a1a1a"/>
    
    <!-- 脖子 -->
    <rect x="14" y="25" width="4" height="3" fill="#FFFFFF"/>
    <path d="M14 25 L14 28 M18 25 L18 28" stroke="#1a1a1a" stroke-width="0.5"/>
    
    <!-- 衣服领子 -->
    <path d="M11.5 28 L14 25 L16 27 L18 25 L20.5 28" fill="#1a1a1a"/>
    <rect x="15" y="27" width="2" height="2" fill="#FFFFFF"/>
    <text x="16" y="28.5" font-size="1.5" fill="#1a1a1a" text-anchor="middle" font-family="serif" font-weight="bold">H</text>
  </g>
</svg>