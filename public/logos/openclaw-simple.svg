<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- OpenClaw: simplified lobster in brand gradient -->
  <defs>
    <linearGradient id="claw-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d4d"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
  </defs>
  <!-- body -->
  <ellipse cx="16" cy="18" rx="10" ry="8" fill="url(#claw-grad)"/>
  <!-- claws (left + right) -->
  <path d="M6 14 Q3 10 5 8" stroke="url(#claw-grad)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M26 14 Q29 10 27 8" stroke="url(#claw-grad)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- eyes -->
  <circle cx="12" cy="16" r="2" fill="#050810"/>
  <circle cx="20" cy="16" r="2" fill="#050810"/>
  <circle cx="12.5" cy="15.5" r="0.8" fill="#00e5cc"/>
  <circle cx="20.5" cy="15.5" r="0.8" fill="#00e5cc"/>
  <!-- antennae -->
  <line x1="10" y1="10" x2="7" y2="6" stroke="#ff4d4d" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="22" y1="10" x2="25" y2="6" stroke="#ff4d4d" stroke-width="1.5" stroke-linecap="round"/>
</svg>
