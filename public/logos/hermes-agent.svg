<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- Hermes: winged helmet + caduceus (simplified) -->
  <!-- background circle: Hermes brand purple #6b46ff -->
  <circle cx="16" cy="16" r="15" fill="#6b46ff"/>
  <!-- caduceus (staff with two snakes) -->
  <line x1="16" y1="6" x2="16" y2="26" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <!-- top wings -->
  <path d="M10 8 Q6 4 4 8 Q6 12 10 10 Z" fill="white" opacity="0.9"/>
  <path d="M22 8 Q26 4 28 8 Q26 12 22 10 Z" fill="white" opacity="0.9"/>
  <!-- snake curves on staff -->
  <path d="M14 12 Q16 10 18 12 Q16 14 14 16" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M14 16 Q16 14 18 16 Q16 18 14 20" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- small orb at top -->
  <circle cx="16" cy="6" r="2" fill="white"/>
</svg>
