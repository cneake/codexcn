<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- OpenCode 官方 logo：白色圆角方块 + 紫色云朵 + >_ -->
  <defs>
    <linearGradient id="opencodeCloud" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
  </defs>
  <!-- 白色背景圆角方块 -->
  <rect width="24" height="24" rx="5" fill="#FFFFFF"/>
  <!-- 紫色云朵（多瓣圆弧组成） -->
  <path d="M6 13 Q 4 13 4 11 Q 4 9 6 9 Q 6 7 8 7 Q 9 5.5 11 6 Q 12 4.5 14 5.5 Q 16 5 17 7 Q 19 7 19 9 Q 20.5 9.5 20 11.5 Q 20 13.5 18 13.5 L 6 13.5 Z" fill="url(#opencodeCloud)"/>
  <!-- 白色 ">_" 终端提示符 -->
  <path d="M9.5 10 L 11.5 12 L 9.5 14" fill="none" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="12.5" y="12.5" width="3" height="1.4" rx="0.4" fill="#FFFFFF"/>
</svg>
