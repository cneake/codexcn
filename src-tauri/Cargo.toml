[package]
name = "app"
version = "0.1.6"
description = "GenHub - AI CLI Tool Manager"
authors = ["Yalan Tech"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2.4.2"
tauri-plugin-shell = "2.3.5"
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
cron = "0.12"
thiserror = "2"
toml = "0.8"
serde_yaml = "0.9"
dirs = "6"
opener = "0.7"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls", "stream", "blocking"] }
futures-util = { version = "0.3", features = ["std"] }
lopdf = "0.34"
zip = "2.2"
urlencoding = "2.1"
sha2 = "0.10"
hex = "0.4"
tokio = { version = "1", features = ["process", "rt-multi-thread", "net", "sync"] }
axum = "0.7"
http-body-util = "0.1"
bytes = "1"
parking_lot = "0.12"
ssh2 = "0.9"
dashmap = "5"
which = "7"
screenshots = "0.8"
image = "0.24"
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
